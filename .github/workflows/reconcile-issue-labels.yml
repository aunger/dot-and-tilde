name: Reconcile issue labels on open PRs

# Applies propagate-issue-labels.yml's rule to every open pull request, on
# demand, through vcs-automation's reconcile-issue-labels action: for a pull
# request linked to an issue from the Development sidebar that then saw none
# of the events propagate-issue-labels.yml listens for. Run it from the
# Actions tab. workflow_dispatch only, since a schedule would poll every open
# pull request indefinitely for a narrow gap.
#
# The three tables are propagate-issue-labels.yml's;
# tests/test_workflow_tables.py fails when the copies differ.
#
# No checkout: the action runs its own copy of the script, at the commit the
# `uses:` line pins.

on:
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile issue labels across open PRs
        uses: aunger/vcs-automation/reconcile-issue-labels@2f12f1a9c1f064e1a69c4b098776041946092712 # v1.3.0
        with:
          excluded-labels: |
            [
              "orchestrate",
              "orchestrating",
              "verification needed",
              "verified",
              "changes requested",
              "changes done",
              "plugin: orchestrate",
              "plugin: github-supplement",
              "plugin: bag-o-agents",
              "plugin: agent-citizenship"
            ]
          exclusive-sets: |
            [
              ["verification needed", "verified"],
              ["changes requested", "changes done"],
              ["orchestrate", "orchestrating"],
              ["snooze 3 days", "snooze 7 days", "snooze 14 days", "snooze 30 days", "snooze 90 days", "snooze 180 days"]
            ]
          exclusive-prefixes: |
            ["c-a-", "c-r-", "test-failure"]
