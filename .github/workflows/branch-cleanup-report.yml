name: Branch cleanup report

# The report job sorts every branch into Delete, Review and Keep, and writes
# that to the job summary, through vcs-automation's branch-cleanup-report
# action. The delete job then waits for approval in the branch-deletion
# environment: approve it with a comment naming the branches to delete, one
# per line, and it sorts every branch again and deletes the named ones, out of
# those the report job offered. The rules, and the checks made before anything
# is deleted, are in the docstring of the action's branch_cleanup_report.py.
#
# The branch-deletion environment needs required reviewers (Settings >
# Environments); without them the delete job starts unapproved and deletes
# nothing. Limit its deployment branches to main too: a manual run can use
# this workflow's copy on any branch, and only main's has been reviewed.

on:
  schedule:
    - cron: '23 5 * * 1'   # Mondays at 05:23 UTC
  workflow_dispatch:

# A new run cancels one still waiting for approval, whose report is then out
# of date.
concurrency:
  group: branch-cleanup
  cancel-in-progress: true

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      choices: ${{ steps.report.outputs.choices }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Write report
        id: report
        uses: aunger/vcs-automation/branch-cleanup-report@2f12f1a9c1f064e1a69c4b098776041946092712 # v1.3.0
        with:
          mode: report

  delete:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: branch-deletion
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Delete branches named in the approval
        uses: aunger/vcs-automation/branch-cleanup-report@2f12f1a9c1f064e1a69c4b098776041946092712 # v1.3.0
        with:
          mode: delete
          environment: branch-deletion
          choices: ${{ needs.report.outputs.choices }}
