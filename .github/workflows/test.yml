name: Test

# Validates the marketplace and every plugin manifest, and runs each plugin's
# tests. The README's Testing section runs the same checks locally, with
# vcs-automation's run_tests.sh at the commit the uses: line below pins.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        # Pinned to the version the plugin layout was tested with.
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: Validate the marketplace and each plugin
        run: |
          set -e
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Run the shell and Python tests
        # Pinned to a commit on aunger/vcs-automation's main.
        uses: aunger/vcs-automation/run-python-tests@7473f2326de1ee204e4121633ae86f6938a5f2a7
        with:
          paths: plugins
      - name: CI Monitor tests
        # test_ci_monitor.py is a script with its own runner, not unittest
        # cases, so the action's discovery imports it and runs none of it.
        run: python3 plugins/orchestrate/scripts/ci_monitor/test_ci_monitor.py
