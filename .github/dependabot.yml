version: 2
updates:
  # The action pins in .github/workflows. GitHub's own actions are pinned to
  # major tags, and aunger/vcs-automation's run-python-tests to the commit of a
  # release tag, with the tag in a comment beside it. This entry bumps both:
  # the commit pin moves when vcs-automation tags a newer release.
  # One group, so a week's bumps arrive as one pull request.
  # The cooldown block keeps Dependabot's three-day delay for GitHub's actions
  # and lifts it for vcs-automation's, whose releases this repository's owner
  # tags: the delay guards against nothing there, and held v1.1.0 back on the
  # day it was tagged. The exclude patterns match the dependency name, which
  # for a subpath action pinned to a SHA is owner/repo/path, so both that form
  # and the bare owner/repo are listed.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      exclude:
        - "aunger/vcs-automation"
        - "aunger/vcs-automation/*"
    groups:
      actions:
        patterns:
          - "*"
