version: 2
updates:
  # The action pins in .github/workflows. GitHub's own actions are pinned to
  # major tags, and aunger/vcs-automation's run-python-tests to the commit of a
  # release tag, with the tag in a comment beside it. This entry bumps both:
  # the commit pin moves when vcs-automation tags a newer release.
  # One group, so a week's bumps arrive as one pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "UTC"
    groups:
      actions:
        patterns:
          - "*"
