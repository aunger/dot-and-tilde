version: 2
updates:
  # The action pins in .github/workflows. GitHub's own actions are pinned to
  # major tags, which this entry bumps. aunger/vcs-automation's run-python-tests
  # is pinned to a commit SHA, which Dependabot moves only to a newer release
  # tag, and vcs-automation has none yet; aunger/dot-and-tilde#8 decides
  # between tagging its releases and moving that pin by hand.
  # One group, so a week's bumps arrive as one pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "UTC"
    groups:
      actions:
        patterns:
          - "*"
